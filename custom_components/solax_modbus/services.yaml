stop_all:
  name: Stop all SolaX hubs
  description: Force-stop all SolaX hubs (kills timers, tasks, sockets).

stop_hub:
  name: Stop a specific SolaX hub
  description: Force-stop a single SolaX hub by name.
  fields:
    name:
      name: Hub name
      description: Name of the hub to stop (e.g., "SolaX")
      required: true
      example: SolaX

growatt_charge_from_grid:
  name: Growatt – Charge battery from grid (VPP)
  description: >
    Enable VPP-controlled AC charging from the grid on a Growatt inverter.
    power_kw is converted to a percentage of rated power using the cached
    rated_power_pn sensor.  If energy_kwh is provided, the charging duration
    is calculated automatically (energy_kwh / power_kw * 60 minutes, max 1440).
    Omitting energy_kwh charges indefinitely until the next inverter power
    cycle or until growatt_stop_vpp_charge is called.
    Note: registers 30407, 30408 and 30409 are "Not storage" – they reset on
    inverter power cycle.
  fields:
    name:
      name: Hub name
      description: Name of the hub (e.g., "SolaX")
      required: true
      example: SolaX
    power_kw:
      name: Charge power (kW)
      description: >
        Charging power in kilowatts. Automatically clamped to the battery's
        reported maximum charge power (battery_max_charge_power sensor).
      required: true
      example: 3.0
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: kW
    energy_kwh:
      name: Energy target (kWh)
      description: >
        Total energy to charge in kWh. Duration is auto-calculated from
        energy_kwh / power_kw. Omit for indefinite charging.
      required: false
      example: 5.0
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          unit_of_measurement: kWh

growatt_discharge_to_grid:
  name: Growatt – Discharge battery to grid (VPP)
  description: >
    Enable VPP-controlled battery discharge to the grid on a Growatt inverter.
    power_kw is converted to a percentage of rated power using the cached
    rated_power_pn sensor.  If energy_kwh is provided, the discharge duration
    is calculated automatically (energy_kwh / power_kw * 60 minutes, max 1440).
    Omitting energy_kwh discharges indefinitely until the next inverter power
    cycle or until growatt_stop_vpp_charge is called.
    Note: registers 30407, 30408 and 30409 are "Not storage" – they reset on
    inverter power cycle.
  fields:
    name:
      name: Hub name
      description: Name of the hub (e.g., "SolaX")
      required: true
      example: SolaX
    power_kw:
      name: Discharge power (kW)
      description: >
        Discharge power in kilowatts. Automatically clamped to the battery's
        reported maximum discharge power (battery_max_discharge_power sensor).
      required: true
      example: 3.0
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: kW
    energy_kwh:
      name: Energy target (kWh)
      description: >
        Total energy to discharge in kWh. Duration is auto-calculated from
        energy_kwh / power_kw. Omit for indefinite discharging.
      required: false
      example: 5.0
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          unit_of_measurement: kWh

growatt_stop_vpp_charge:
  name: Growatt – Stop VPP grid charge/discharge
  description: >
    Stop VPP-controlled charge or discharge on a Growatt inverter and release
    VPP control authority. Writes 30407=0 (disable remote control), 30410=0
    (disable AC charging), 30100=0 (release control authority).
  fields:
    name:
      name: Hub name
      description: Name of the hub (e.g., "SolaX")
      required: true
      example: SolaX

estimate_grid_charge:
  name: Estimate grid charge needed
  description: >
    Calculate how many kWh must be imported from the grid to reach a target
    battery state-of-charge by a given time, accounting for projected solar
    generation and house consumption between now and that time.

    Reads the current battery SoC and usable capacity (kWh) from the live
    inverter data.  Returns a response dict with grid_charge_kwh and the
    input values used for the calculation.

    Use projected_consumption_kwh = 0 for a conservative estimate where all
    solar is assumed to go directly into the battery.
  fields:
    name:
      name: Hub name
      description: Name of the hub (e.g., "SolaX")
      required: true
      example: SolaX
    target_soc_pct:
      name: Target SoC (%)
      description: Desired battery state-of-charge at the target time (0–100 %).
      required: true
      example: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    projected_solar_kwh:
      name: Projected solar (kWh)
      description: >
        Expected solar (and any other renewable) generation between now and the
        target time, in kWh.
      required: true
      example: 4.5
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          unit_of_measurement: kWh
    projected_consumption_kwh:
      name: Projected house load (kWh)
      description: >
        Expected house consumption between now and the target time, in kWh.
        Defaults to 0 (all solar is available for battery charging).
      required: false
      example: 2.0
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          unit_of_measurement: kWh

estimate_grid_export:
  name: Estimate grid export available
  description: >
    Calculate how many kWh can be exported (sold) to the grid without the
    battery falling below a self-sufficiency floor, after accounting for
    projected solar generation and house consumption.

    The battery is assumed to absorb net solar first (solar minus consumption).
    If the resulting projected level exceeds full capacity, the overflow is
    already passively exported and is not counted twice.

    Returns a response dict with export_kwh and the inputs used.
  fields:
    name:
      name: Hub name
      description: Name of the hub (e.g., "SolaX")
      required: true
      example: SolaX
    min_soc_pct:
      name: Self-sufficiency floor (%)
      description: >
        Minimum battery SoC to preserve for self-sufficiency.  Energy below
        this level is not available for export (0–100 %).
      required: true
      example: 20
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    projected_solar_kwh:
      name: Projected solar (kWh)
      description: >
        Expected solar (and any other renewable) generation between now and the
        target time, in kWh.
      required: true
      example: 5.0
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          unit_of_measurement: kWh
    projected_consumption_kwh:
      name: Projected house load (kWh)
      description: >
        Expected house consumption between now and the target time, in kWh.
        Defaults to 0 (all solar available to charge the battery first).
      required: false
      example: 2.0
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          unit_of_measurement: kWh
